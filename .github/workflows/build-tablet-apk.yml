# Builds the GaggiMate Android app (Capacitor) for the dedicated machine tablet
# and publishes the APK as a GitHub Release so the tablet can download it directly.
# Run manually: Actions tab -> "Build Tablet APK" -> Run workflow.
name: Build Tablet APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: ver
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_VERSION=tablet-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # sharp (used only by @capacitor/assets for icon generation) downloads libvips
      # at install time and keeps timing out, so install scripts are skipped and only
      # esbuild's script is run afterwards.
      - name: Install web dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Build app web bundle
        working-directory: web
        run: npm run build:app

      - name: Sync Capacitor Android project
        working-directory: web
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ hashFiles('web/android/gradle/wrapper/gradle-wrapper.properties', 'web/android/**/*.gradle') }}
          restore-keys: gradle-

      # The Gradle download is redirected to GitHub release storage, which has been
      # returning 504s: use the smaller -bin distribution, a longer timeout, and retries.
      - name: Download Gradle (with retries)
        working-directory: web/android
        run: |
          sed -i 's/-all\.zip/-bin.zip/; s/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4 5; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle download failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      # Maven Central hands some large artifacts (e.g. the Kotlin compiler) off to
      # GitHub release storage, which keeps returning 504s. Point mavenCentral() at
      # Google's Maven Central mirror instead, via a Gradle init script.
      - name: Use Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def useMirror = { RepositoryHandler repos ->
              repos.configureEach { repo ->
                  if (repo instanceof MavenArtifactRepository &&
                      repo.url.toString().startsWith('https://repo.maven.apache.org/maven2')) {
                      repo.url = MIRROR
                  }
              }
          }
          allprojects {
              useMirror(buildscript.repositories)
              useMirror(repositories)
          }
          EOF

      - name: Build debug APK (with retries)
        working-directory: web/android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon -PappVersionName="tablet-${{ steps.ver.outputs.short_sha }}" && exit 0
            echo "Gradle build failed (attempt $i), retrying in 60s..."
            sleep 60
          done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk "out/gaggimate-tablet-${{ steps.ver.outputs.short_sha }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaggimate-tablet-apk
          path: out/*.apk

      - name: Publish release (direct download for the tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tablet-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Tablet APK #${{ github.run_number }} (${{ steps.ver.outputs.short_sha }})" \
            --notes "GaggiMate tablet app, debug build from ${{ github.sha }}." \
            --prerelease
