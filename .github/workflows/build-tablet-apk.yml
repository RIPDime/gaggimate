# Builds the GaggiMate Android app (Capacitor) for the dedicated machine tablet
# and publishes the APK as a GitHub Release so the tablet can download it directly.
# Run manually: Actions tab -> "Build Tablet APK" -> Run workflow.
name: Build Tablet APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: ver
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "BUNDLE_VERSION=tablet-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # sharp (used only by @capacitor/assets for icon generation) downloads libvips
      # at install time and keeps timing out, so install scripts are skipped and only
      # esbuild's script is run afterwards.
      - name: Install web dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Build app web bundle
        working-directory: web
        run: npm run build:app

      - name: Sync Capacitor Android project
        working-directory: web
        run: npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon -PappVersionName="tablet-${{ steps.ver.outputs.short_sha }}"

      - name: Rename APK
        run: |
          mkdir -p out
          cp web/android/app/build/outputs/apk/debug/app-debug.apk "out/gaggimate-tablet-${{ steps.ver.outputs.short_sha }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaggimate-tablet-apk
          path: out/*.apk

      - name: Publish release (direct download for the tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tablet-${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Tablet APK #${{ github.run_number }} (${{ steps.ver.outputs.short_sha }})" \
            --notes "GaggiMate tablet app, debug build from ${{ github.sha }}." \
            --prerelease
